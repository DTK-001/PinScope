name = "pinscope-course-sync"
main = "worker.js"
compatibility_date = "2026-05-05"

# Create the KV namespace with:
# wrangler kv namespace create PINSCOPE_COURSES
# Then paste the returned id below.
[[kv_namespaces]]
binding = "PINSCOPE_COURSES"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# Create the R2 bucket with:
# wrangler r2 bucket create pinscope-hole-snapshots
[[r2_buckets]]
binding = "PINSCOPE_SNAPSHOTS"
bucket_name = "pinscope-hole-snapshots"
